name: CareLoop CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Type Check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Code formatting check (ruff)
        run: ruff format --check careloop/ tests/ scripts/

      - name: Linting check (ruff)
        run: ruff check careloop/ tests/ scripts/

      - name: Static type checking (mypy)
        run: mypy

  security-and-compliance:
    name: Security & CloudFormation Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install security & audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit cfn-lint detect-secrets pip-audit

      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit --skip-editable

      - name: SAST Security scanning (bandit)
        run: bandit -r careloop/

      - name: Secret leakage scanning (detect-secrets)
        run: detect-secrets scan --baseline .secrets.baseline

      - name: CloudFormation & SAM template validation (cfn-lint)
        run: cfn-lint template.yaml deploy/sam/template.yaml

  test-and-coverage:
    name: Unit & Integration Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite with coverage
        # AWS-dependent tests are skipped by default (-m 'not aws') and do not require credentials
        run: |
          pytest --cov=careloop --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Verify zero git working tree pollution
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || (echo "Working tree polluted by tests!" && exit 1)
